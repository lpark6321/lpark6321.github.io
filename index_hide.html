<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taiwan Stock Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style/variables.css">
  <link rel="stylesheet" href="./style/layout.css">
  <link rel="stylesheet" href="./style/header.css">
  <link rel="stylesheet" href="./style/components.css">
  <link rel="stylesheet" href="./pages/page1/page1.css">
  <link rel="stylesheet" href="./pages/page2/page2.css">
  <link rel="stylesheet" href="./pages/page3/page3.css">
  <link rel="stylesheet" href="./pages/page4/page4.css">
  <link rel="stylesheet" href="./pages/page5/page5.css">
  <link rel="stylesheet" href="./pages/page6/page6.css">
  <link rel="stylesheet" href="./pages/page7/page7.css">
  <link rel="stylesheet" href="./pages/page8/page8.css">
</head>
<body>
  <div class="shell">
    <!-- 標頭兩列：上面是標題與分頁，下面是資料來源控制、狀態與提示；窄的時候自動換行。 -->
    <header class="shell__header">
      <div class="shell__top">
        <h1 class="shell__title">Taiwan Stock Dashboard</h1>
        <nav class="tabbar" aria-label="分頁（快捷鍵 1–8）">
          <button class="tabbar__tab" type="button" data-page="page1" title="PAGE 1 Futures Overview（快捷鍵 1）">1 期貨總覽</button>
          <button class="tabbar__tab" type="button" data-page="page2" title="PAGE 2 Market Temperature（快捷鍵 2）">2 台股溫度計</button>
          <button class="tabbar__tab" type="button" data-page="page3" title="PAGE 3 Watchlist Alerts（快捷鍵 3）">3 自選提醒</button>
          <button class="tabbar__tab" type="button" data-page="page4" title="PAGE 4 Options Strategy（快捷鍵 4）">4 選擇權</button>
          <button class="tabbar__tab" type="button" data-page="page5" title="PAGE 5 Stock Screener（快捷鍵 5）">5 選股</button>
          <button class="tabbar__tab" type="button" data-page="page6" title="PAGE 6 Market Map（快捷鍵 6）">6 市場地圖</button>
          <button class="tabbar__tab" type="button" data-page="page7" title="PAGE 7 Global Indices（快捷鍵 7）">7 全球指數</button>
          <button class="tabbar__tab" type="button" data-page="page8" title="PAGE 8 Chips Monitor（快捷鍵 8）">8 籌碼監控</button>
        </nav>
      </div>
      <div class="shell__bar">
        <label class="shell-source" for="dashboard-data-source">
          <span class="shell-source__label">資料來源</span>
          <select class="shell-source__select" id="dashboard-data-source"></select>
        </label>
        <label class="shell-source" for="dashboard-poll-interval">
          <span class="shell-source__label">頻率</span>
          <select class="shell-source__select" id="dashboard-poll-interval"></select>
        </label>
        <button class="shell-refresh" type="button" id="dashboard-manual-refresh" title="快捷鍵 R">手動更新</button>
        <span class="shell-source-status" id="dashboard-data-source-status"></span>
        <span class="shell-market" id="dashboard-market-status"></span>
        <span class="shell-market" id="dashboard-futures-status"></span>
        <span class="shell-health" id="dashboard-health" role="status" hidden></span>
        <details class="shell-menu shell-bell" id="dashboard-notices">
          <summary class="shell-refresh" title="今日通知" aria-label="今日通知">🔔<span class="shell-bell__badge" id="dashboard-notices-badge" hidden></span></summary>
          <div class="shell-menu__list shell-bell__panel">
            <div class="shell-bell__head">
              <span class="shell-bell__heading">今日通知</span>
              <button class="shell-menu__item" type="button" id="dashboard-notices-read">全部已讀</button>
              <button class="shell-menu__item" type="button" id="dashboard-notices-clear">清除</button>
            </div>
            <ol class="shell-bell__list" id="dashboard-notices-list"></ol>
          </div>
        </details>
        <details class="shell-menu" id="dashboard-menu">
          <summary class="shell-refresh" title="更多">⋯</summary>
          <div class="shell-menu__list">
            <button class="shell-menu__item" type="button" id="dashboard-settings-export" title="把自選股、策略、篩選條件等所有設定存成一個檔案">設定備份</button>
            <button class="shell-menu__item" type="button" id="dashboard-settings-import" title="從備份檔還原所有設定">設定還原</button>
            <a class="shell-menu__item" href="./index.html">Data Lab</a>
            <span class="shell-menu__hint" title="過去月份／日期的盤後資料不會再變，勾選的群組由本機代理存成檔案（bridges/.cache/），重開代理不必重抓">盤後資料存本機</span>
            <div id="dashboard-disk-cache"></div>
            <span class="shell-menu__hint">快捷鍵：1–8 切頁、R 手動更新</span>
          </div>
        </details>
      </div>
    </header>
    <main id="app" class="shell__main" aria-live="polite"></main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
